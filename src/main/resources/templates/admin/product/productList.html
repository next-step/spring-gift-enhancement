<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 목록 폼</title>
    <link rel="stylesheet" th:href="@{/product-list.css}">
</head>
<body>
<h2>상품 목록</h2>

<!-- 정렬 선택 폼 -->
<form method="get" action="#" id="sortForm">
    <label for="sortSelect">정렬:</label>
    <select name="sort" id="sortSelect" onchange="document.getElementById('sortForm').submit()">
        <option value="id,desc" th:selected="${currentSort eq 'id,desc'}">최신순</option>
        <option value="price,asc" th:selected="${currentSort eq 'price,asc'}">가격 오름차순</option>
        <option value="price,desc" th:selected="${currentSort eq 'price,desc'}">가격 내림차순</option>
        <option value="name,asc" th:selected="${currentSort eq 'name,asc'}">이름 오름차순</option>
        <option value="name,desc" th:selected="${currentSort eq 'name,desc'}">이름 내림차순</option>
    </select>
    <!-- 현재 페이지 번호 유지 (1-based) -->
    <input type="hidden" name="page" th:value="${products.number + 1}" />
</form>

<div class="action-bar">
    <a class="add-button" th:href="@{/admin/products/new}">상품 추가</a>
</div>

<table th:border="1">
    <tr>
        <th>아이디</th>
        <th>이름</th>
        <th>가격</th>
        <th>수량</th>
        <th>이미지</th>
        <th>관리</th>
    </tr>
    <tr th:each="product : ${products}">
        <td th:text="${product.id}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.price}"></td>
        <td th:text="${product.quantity}"></td>
        <td th:text="${product.imageUrl}"></td>
        <td>
            <a th:href="@{'/admin/products/' + ${product.id} + '/edit'}">수정</a>
            <form th:action="@{'/admin/products/' + ${product.id} + '/delete'}" method="post" style="display:inline;">
                <input type="submit" value="삭제" onclick="return confirm('정말 삭제하시겠습니까?');">
            </form>
        </td>
    </tr>
</table>

<!-- 페이징 -->
<div class="pagination" th:with="currentSort=${param.sort != null ? param.sort : 'id,desc'}">
    <span th:if="${products.hasPrevious()}">
        <a th:href="@{'/admin/products?page=' + ${products.number} + '&sort=' + ${currentSort}}">이전</a>
    </span>

    <span th:each="pageNum : ${#numbers.sequence(1, products.totalPages)}">
        <a th:href="@{'/admin/products?page=' + ${pageNum} + '&sort=' + ${currentSort}}"
           th:text="${pageNum}"
           th:classappend="${pageNum == products.number + 1} ? 'active' : ''">
        </a>
    </span>

    <span th:if="${products.hasNext()}">
        <a th:href="@{'/admin/products?page=' + ${products.number + 2} + '&sort=' + ${currentSort}}">다음</a>
    </span>
</div>

</body>
</html>
