<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 리스트</title>
</head>
<body>
<h1>상품 리스트</h1>
<table>
    <tr><th>ID</th><th>상품명</th><th>가격</th><th>이미지 주소</th></tr>
    <tr th:each="product : ${products}">
        <td th:text="${product.id}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.price}"></td>
        <td th:text="${product.imageUrl}"></td>
        <td><a th:href="@{|/api/admin/product/${product.id}/update|}">수정</a></td>
        <td><form th:action="@{|/api/admin/product/${product.id}/delete|}" method="post">
            <input type="hidden" name="_method" value="delete" />
            <button type="submit">삭제</button>
        </form></td>
    </tr>
</table>
<div>
    <a th:href="@{/api/admin/product/add}">상품 추가</a>
</div>
<div>
    <a th:href="@{/api/admin/user/list}">회원 페이지로 이동</a>
</div>

<div class="pagination">
    <button th:if="${currentPage > 0}"
            th:onclick="|window.location='?page=${currentPage - 1}&size=${size}'|">
        이전
    </button>

    <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
    <button th:classappend="${i == currentPage} ? 'active'"
            th:onclick="|window.location='?page=${i}&size=${size}'|">
      <span th:text="${i + 1}">1</span>
    </button>
  </span>

    <button th:if="${currentPage < totalPages - 1}"
            th:onclick="|window.location='?page=${currentPage + 1}&size=${size}'|">
        다음
    </button>
</div>
</body>
</html>
